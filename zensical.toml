[project]
site_name = "BiciTierra Market"
site_description = "Documento de trabajo, píldoras y materiales prácticos del proyecto de IABD"
site_url = "https://comfypenguin.github.io/iabd-26-27/"
docs_dir = "web_docs"
site_dir = "site"
use_directory_urls = false
extra_css = ["assets-projecte/projecte.css"]
nav = [
  { "Idioma / Llengua" = [
    { "Castellano" = "es/index.md" },
    { "Valencià" = "index.md" }
  ] },
  { "Documento de trabajo" = "es/index.md" },
  { "Descargas" = "es/DESCARREGUES.md" },
  { "Materiales prácticos" = [
    { "Datos del proyecto" = "es/MATERIALS_PRACTICS/dades/README.md" },
    { "Diccionario de datos" = "es/MATERIALS_PRACTICS/dades/DICCIONARI_DADES.md" },
    { "Notebooks por semanas" = "es/MATERIALS_PRACTICS/notebooks/README.md" },
    { "Dashboard" = "es/MATERIALS_PRACTICS/dashboards/README.md" },
    { "Briefing de Power BI" = "es/MATERIALS_PRACTICS/dashboards/01_briefing_powerbi.md" },
    { "KPIs y visuales" = "es/MATERIALS_PRACTICS/dashboards/02_kpis_i_visuals.md" },
    { "Modelo de tablas" = "es/MATERIALS_PRACTICS/dashboards/03_model_taules.md" }
  ] },
  { "Píldoras breves" = [
    { "Python y entornos" = "es/PINDOLES/python-i-entorns.md" },
    { "Jupyter" = "es/PINDOLES/jupyter-notebooks.md" },
    { "Python para datos" = "es/PINDOLES/python-per-a-dades-i.md" },
    { "EDA y calidad" = "es/PINDOLES/eda-i-qualitat-de-dades.md" },
    { "Visualización" = "es/PINDOLES/visualitzacio-amb-matplotlib-i-seaborn.md" },
    { "Scikit-learn" = "es/PINDOLES/scikit-learn-intro.md" },
    { "Validación de modelos" = "es/PINDOLES/validacio-de-models.md" },
    { "Clustering" = "es/PINDOLES/clustering-i-segmentacio.md" },
    { "SHAP y LIME" = "es/PINDOLES/xai-shap-lime.md" },
    { "Power BI" = "es/PINDOLES/dashboards-i-powerbi.md" },
    { "MLflow" = "es/PINDOLES/mlflow-intro.md" },
  ] },
  { "Píldoras ampliadas" = [
    { "Índice y recorridos" = "es/PINDOLES_AMPLIADES/docs/index.md" },
    { "Python y entornos" = "es/PINDOLES_AMPLIADES/docs/python-i-entorns/index.md" },
    { "Jupyter" = "es/PINDOLES_AMPLIADES/docs/jupyter-notebooks/index.md" },
    { "Python para datos" = "es/PINDOLES_AMPLIADES/docs/python-per-a-dades-i/index.md" },
    { "EDA y calidad" = "es/PINDOLES_AMPLIADES/docs/eda-i-qualitat-de-dades/index.md" },
    { "Visualización" = "es/PINDOLES_AMPLIADES/docs/visualitzacio-amb-matplotlib-i-seaborn/index.md" },
    { "Scikit-learn" = "es/PINDOLES_AMPLIADES/docs/scikit-learn-intro/index.md" },
    { "Validación de modelos" = "es/PINDOLES_AMPLIADES/docs/validacio-de-models/index.md" },
    { "Clustering" = "es/PINDOLES_AMPLIADES/docs/clustering-i-segmentacio/index.md" },
    { "SHAP y LIME" = "es/PINDOLES_AMPLIADES/docs/xai-shap-lime/index.md" },
    { "Power BI" = "es/PINDOLES_AMPLIADES/docs/dashboards-i-powerbi/index.md" },
    { "MLflow" = "es/PINDOLES_AMPLIADES/docs/mlflow-intro/index.md" },
  ] },
   { "Glosario" = "es/glossari_terms.md" },
 ]

[project.theme]
language = "es"
features = ["navigation.tabs", "navigation.sections", "navigation.top", "search.highlight", "content.code.copy", "toc.follow"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "orange"
toggle.icon = "material/weather-night"
toggle.name = "Activar modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Activar modo claro"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
toc = { permalink = true }
